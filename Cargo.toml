[workspace]
resolver = "2"
members = [
    "crates/polyscope-core",
    "crates/polyscope-render",
    "crates/polyscope-ui",
    "crates/polyscope-structures",
    "crates/polyscope",
]

[workspace.package]
version = "0.6.2"
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/xarthurx/polyscope-rs"
authors = ["polyscope-rs contributors"]

[workspace.dependencies]
# Internal crates
polyscope-core = { version = "0.6.2", path = "crates/polyscope-core" }
polyscope-render = { version = "0.6.2", path = "crates/polyscope-render" }
polyscope-ui = { version = "0.6.2", path = "crates/polyscope-ui" }
polyscope-structures = { version = "0.6.2", path = "crates/polyscope-structures" }

# Math
glam = { version = "0.34", features = ["serde"] }

# Rendering
wgpu = "30"
winit = "0.30"

# UI (egui - pure Rust, no native dependencies)
egui = "0.36"
egui-wgpu = "0.36"
egui-winit = "0.36"
transform-gizmo-egui = "0.11"

# Utilities
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = "0.25"
tobj = "4.0"
log = "0.4"
env_logger = "0.11"
thiserror = "2.0"
bytemuck = { version = "1.14", features = ["derive"] }
pollster = "1.0"

# Testing
proptest = "1.5"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
